<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 — 海河洪涝决策仿真平台 V2.6</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--text:#2d3748;--muted:#718096;--border:#e2e8f0;--blue:#4472C4;--green:#55A868;--amber:#DD8452;--red:#C44E52;--gold:#D4A853;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
.top-bar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-radius:var(--radius);margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.top-bar h1{font-size:1.15rem;font-weight:700;color:var(--blue)}
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--border);padding-bottom:0}
.tab{padding:10px 20px;font-size:.9rem;font-weight:600;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab:hover{color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.card h3{font-size:1rem;font-weight:700;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 20px;border-radius:7px;font-size:.86rem;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{opacity:.9}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{opacity:.9}
.btn-warning{background:var(--amber);color:#fff}.btn-warning:hover{opacity:.9}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--blue);color:var(--blue)}
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.room-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;border:1.5px solid var(--border)}
.room-card .code{font-family:'JetBrains Mono',monospace;font-size:1.3rem;font-weight:700;color:var(--blue);letter-spacing:2px}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem;text-align:left}
.tbl th{padding:10px;border-bottom:2px solid var(--border);color:var(--muted);font-weight:600}
.tbl td{padding:10px;border-bottom:1px solid var(--border)}
.toast{position:fixed;top:16px;right:16px;z-index:999;padding:12px 24px;border-radius:8px;background:var(--green);color:#fff;font-size:.9rem;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:opacity 0.3s}
.hidden{display:none!important}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.stat-box .sv{font-size:1.5rem;font-weight:700;color:var(--blue)}
.stat-box .sl{font-size:.76rem;color:var(--muted);margin-top:4px}
.action-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600}
.action-drain{background:#ebf8ff;color:#2b6cb0}
.action-build{background:#f0fff4;color:#2f855a}
.action-evac{background:#fff5f5;color:#c53030}
</style>
</head>
<body>

<div class="top-bar">
  <h1>海河洪涝决策仿真平台 · 教师控制台</h1>
  <div style="font-size:.85rem;font-weight:600" id="server-status">连接中...</div>
</div>

<div style="max-width:1200px;margin:0 auto">
  <div class="tabs">
    <button class="tab active" data-tab="rooms">🎮 房间管理</button>
    <button class="tab" data-tab="config">⚡ 教学干预 (上帝之手)</button>
    <button class="tab" data-tab="data" onclick="loadData()">📊 多维数据看板</button>
    <button class="tab" data-tab="export">📥 数据导出</button>
  </div>
  
  <div id="tab-rooms">
    <div class="card">
      <h3>创建演练房间</h3>
      <div style="display:flex;gap:10px;align-items:center">
        <input id="new-group" value="实验组" placeholder="组名" style="padding:8px 12px;border:1px solid var(--border);border-radius:6px">
        <button class="btn btn-primary" onclick="createRoom()">新建推演房间</button>
      </div>
    </div>
    <div id="room-list" class="room-grid">加载中...</div>
  </div>

  <div id="tab-config" class="hidden">
    <div class="card">
      <h3>⚡ 动态情景干预面板</h3>
      <p style="font-size:.85rem;color:var(--muted);margin-bottom:20px;line-height:1.6">
        下达突发指令，强行改变系统演化轨迹，考察学生对复杂系统的适应性治理能力。
      </p>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:20px">
        <label style="font-weight:700">目标房间码:</label>
        <input id="target-room" placeholder="如 R1234 (必填)" style="padding:9px;border:1px solid var(--border);border-radius:6px;width:180px">
      </div>
      
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px">
        <div style="border:1.5px solid var(--red);padding:15px;border-radius:8px;background:#fff5f5">
          <h4 style="color:var(--red);margin-bottom:8px">特大暴雨预警</h4>
          <p style="font-size:.75rem;color:var(--muted);margin-bottom:12px">引发全流域恐慌值上升，面降雨量基数真实暴涨 50%。</p>
          <button class="btn btn-danger" style="width:100%" onclick="triggerEvent('【中央气象台紧急预警】强对流天气叠加！未来12小时全流域将面临极端特大暴雨，请立即做好抗洪抢险准备！')">广播暴雨指令</button>
        </div>
        <div style="border:1.5px solid var(--gold);padding:15px;border-radius:8px;background:#fffff0">
          <h4 style="color:var(--gold);margin-bottom:8px">通讯阻断危机</h4>
          <p style="font-size:.75rem;color:var(--muted);margin-bottom:12px">模拟基站损毁，测试基层村庄依靠预案自组织的防汛能力。</p>
          <button class="btn btn-warning" style="width:100%" onclick="triggerEvent('⚡【系统突发】电力设施受损，各地通讯可能中断！请各行政主体做好依靠预案独立决策的准备！')">广播通讯危机</button>
        </div>
        <div style="border:1.5px solid var(--green);padding:15px;border-radius:8px;background:#f0fff4">
          <h4 style="color:var(--green);margin-bottom:8px">生态补偿政策</h4>
          <p style="font-size:.75rem;color:var(--muted);margin-bottom:12px">引导上下游协同博弈，中央财政直达基层账面。</p>
          <button class="btn btn-primary" style="background:var(--green);width:100%" onclick="triggerEvent('📜【政策引导】国家防总拟启动流域生态补偿。凡主动蓄洪、减缓下游压力的地区，灾后将获得专项补偿！')">发布补偿机制</button>
        </div>
      </div>
    </div>
  </div>

  <div id="tab-data" class="hidden">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>📊 实时决策流追踪</h3>
        <button class="btn btn-outline" onclick="loadData()">🔄 强力刷新看板数据</button>
      </div>
      <div id="data-overview" style="margin-top: 15px;">拉取云端记录中...</div>
    </div>
  </div>

  <div id="tab-export" class="hidden">
    <div class="card">
      <h3>📥 教学全维度数据导出</h3>
      <p style="font-size:.85rem;color:var(--muted);margin-bottom:20px">
        为防止浏览器安全拦截，导出通道已拆分。CSV 格式可完美适配 Excel 直接双击打开，自带防乱码处理。
      </p>
      <div style="display:flex;gap:15px;align-items:center;margin-bottom:20px">
        <label style="font-weight:700">目标房间:</label>
        <input id="exp-room" placeholder="输入房间码 (留空则导出所有)" style="padding:10px;border:1px solid var(--border);border-radius:6px;width:250px">
      </div>
      <div style="display:flex;gap:15px">
        <button class="btn btn-primary" onclick="doExportCSV()" style="background: var(--green);">📊 导出 Excel 分析表 (CSV)</button>
        <button class="btn btn-outline" onclick="doExportJSON()">🗄️ 导出 JSON 原始库</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-area"></div>

<script>
const API = 'https://api.resil-hub.cn';

async function safeFetch(url, opts) {
  try {
    const res = await fetch(url, opts);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch(e) { return null; }
}

async function checkHealth() {
  const st = document.getElementById('server-status');
  const d = await safeFetch(API + '/api/health');
  if(d && d.ok) {
    st.textContent = '✅ 已连接云端引擎'; st.style.color = 'var(--green)'; loadRooms();
  } else {
    st.textContent = '❌ API 连接异常'; st.style.color = 'var(--red)';
  }
}

function toast(msg, color) {
  const d = document.createElement('div');
  d.className = 'toast'; d.style.background = color || 'var(--green)'; d.textContent = msg;
  document.getElementById('toast-area').appendChild(d);
  setTimeout(() => { d.style.opacity='0'; setTimeout(()=>d.remove(),300); }, 2500);
}

async function loadRooms() {
  const el = document.getElementById('room-list');
  const data = await safeFetch(API + '/api/rooms?_t=' + Date.now());
  if (!data) return;
  el.innerHTML = data.map(r => `
    <div class="room-card">
      <div class="code">${r.code}</div>
      <div style="font-size:.8rem; margin:8px 0">${r.group_name} · 状态: ${r.status}</div>
      <div style="display:flex;gap:5px">
        ${r.status==='WAITING'?`<button class="btn btn-primary btn-sm" onclick="startRoom('${r.code}')">🚀 发令</button>`:''}
        <button class="btn btn-outline btn-sm" onclick="deleteRoom('${r.code}')">删除</button>
      </div>
    </div>`).join('') || '暂无活跃房间';
}
async function createRoom() { await safeFetch(API + '/api/rooms', { method: 'POST', body: JSON.stringify({group_name: document.getElementById('new-group').value}) }); loadRooms(); }
async function startRoom(c) { await safeFetch(`${API}/api/rooms/${c}/start`, { method: 'POST' }); toast('推演发令成功！'); loadRooms(); }
async function deleteRoom(c) { if(confirm('确认删除？')) { await safeFetch(`${API}/api/rooms/${c}`, { method: 'DELETE' }); loadRooms(); } }

async function triggerEvent(msg) {
  const rm = document.getElementById('target-room').value.trim();
  if(!rm) return toast('⚠️ 必须输入目标房间码！', 'var(--amber)');
  const payload = { room_id: rm, round_num: 99, player_id: 'SYSTEM', player_name: '国家防总', role: 'ADMIN', channel: 'ALL', village: '', content: msg, msg_type: 'sys' };
  const d = await safeFetch(API + '/api/data/chats', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
  if(d) toast('⚡ 干预指令已下发！学生端将收到警报。', 'var(--amber)');
}

async function loadData() {
  const el = document.getElementById('data-overview');
  el.innerHTML = "正在拉取最新决策...";
  
  const ts = Date.now();
  const [decisions, rounds] = await Promise.all([ 
    safeFetch(API+'/api/data/decisions?_t=' + ts), 
    safeFetch(API+'/api/data/rounds?_t=' + ts) 
  ]);
  
  if(!decisions || decisions.length === 0) {
    el.innerHTML = '<p style="color:var(--muted);padding:20px;">📭 暂无学生决策数据，请等待学生在推演中点击操作按钮。</p>';
    return;
  }
  
  let html = `
    <div class="stat-grid">
      <div class="stat-box"><div class="sv">${rounds?.length || 0}</div><div class="sl">系统轮次总数</div></div>
      <div class="stat-box"><div class="sv">${decisions.length}</div><div class="sl">抓取决策存量</div></div>
    </div>
    <div style="overflow-x:auto;max-height:450px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;">
        <table class="tbl">
          <thead><tr><th>房间.轮次</th><th>角色/主体</th><th>动作源</th><th>决策记录</th><th>操作时间</th></tr></thead>
          <tbody>
  `;
  
  decisions.slice(0, 80).forEach(d => {
    html += `<tr>
      <td style="font-family:monospace; font-weight:700; color:var(--blue)">[${d.room_id}] R${d.round_num}</td>
      <td>${d.player_name}</td>
      <td><span class="action-tag action-drain">${d.action_type || '-'}</span></td>
      <td style="color:var(--red);font-weight:bold">${d.action_value || '-'}</td>
      <td style="color:var(--muted);font-size:0.75rem">${d.ts || d.created_at || '刚刚'}</td>
    </tr>`;
  });
  el.innerHTML = html + '</tbody></table></div>';
  toast("看板数据已强制击穿缓存并刷新！", "var(--blue)");
}

async function doExportCSV() {
  const room = document.getElementById('exp-room').value.trim();
  toast('正在打包 Excel 数据...', 'var(--blue)');
  const data = await safeFetch(API + '/api/export/' + (room || '_all') + '?_t=' + Date.now());
  if(!data || !data.decisions || data.decisions.length === 0) return toast('⚠️ 该房间暂无决策数据', 'var(--amber)');
  downloadBlob(jsonToCSV(data.decisions), `HaiHe_Decisions_${room||'All'}.csv`, 'text/csv');
  toast('✅ Excel 兼容表已下载！', 'var(--green)');
}

async function doExportJSON() {
  const room = document.getElementById('exp-room').value.trim();
  toast('正在打包 JSON 数据...', 'var(--blue)');
  const data = await safeFetch(API + '/api/export/' + (room || '_all') + '?_t=' + Date.now());
  if(!data) return toast('⚠️ 获取数据失败', 'var(--red)');
  downloadBlob(JSON.stringify(data, null, 2), `HaiHe_RawData_${Date.now()}.json`, 'application/json');
  toast('✅ JSON 原始库已下载！', 'var(--green)');
}

function jsonToCSV(arr) {
  const cols = Object.keys(arr[0]);
  const header = cols.join(',');
  const rows = arr.map(obj => cols.map(k => `"${(obj[k]||'').toString().replace(/"/g, '""')}"`).join(','));
  return '\uFEFF' + header + '\n' + rows.join('\n');
}

function downloadBlob(content, name, type) {
  const blob = new Blob([content], {type});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    t.classList.add('active');
    const tabId = t.dataset.tab;
    ['rooms','config','data','export'].forEach(id => { document.getElementById('tab-'+id).classList.toggle('hidden', id !== tabId); });
  });
});
checkHealth();
</script>
</body>
</html>
