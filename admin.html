<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 — 海河洪涝决策仿真平台</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--text:#2d3748;--muted:#718096;--border:#e2e8f0;--blue:#4472C4;--green:#55A868;--amber:#DD8452;--red:#C44E52;--gold:#D4A853;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.top-bar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.top-bar h1{font-size:1.1rem;font-weight:700;color:var(--blue)}
.top-bar a{font-size:.84rem;color:var(--blue);text-decoration:none}
.container{max-width:1100px;margin:0 auto;padding:20px}
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--border);padding-bottom:0}
.tab{padding:10px 20px;font-size:.88rem;font-weight:600;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab:hover{color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.card h3{font-size:.95rem;font-weight:700;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:8px}
.form-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.two{grid-template-columns:1fr 1fr}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:.78rem;color:var(--muted);font-weight:600}
.fg input,.fg select{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:.88rem;color:var(--text);background:var(--bg);outline:none;transition:border .2s}
.fg input:focus{border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:7px;font-size:.86rem;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{opacity:.9}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{opacity:.9}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--blue);color:var(--blue)}
.btn-sm{padding:5px 12px;font-size:.78rem}
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.room-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative}
.room-card .code{font-family:'JetBrains Mono',monospace;font-size:1.3rem;font-weight:700;color:var(--blue);letter-spacing:2px}
.room-card .meta{font-size:.78rem;color:var(--muted);margin:6px 0}
.room-card .status{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.72rem;font-weight:600}
.status-waiting{background:#e8f5e9;color:#2e7d32}
.status-playing{background:#fff3e0;color:#e65100}
.status-finished{background:#f3e5f5;color:#6a1b9a}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.tbl th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);color:var(--muted);font-weight:600;font-size:.76rem}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--border)}
.tbl tr:hover td{background:rgba(68,114,196,.03)}
.toast{position:fixed;top:16px;right:16px;z-index:999;padding:10px 20px;border-radius:8px;background:var(--green);color:#fff;font-size:.86rem;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.12);animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.hidden{display:none!important}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat-box .sv{font-size:1.6rem;font-weight:700;color:var(--blue)}
.stat-box .sl{font-size:.76rem;color:var(--muted);margin-top:4px}
@media(max-width:768px){.form-row{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr 1fr}.room-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top-bar">
  <h1>海河洪涝决策仿真平台 · 管理后台</h1>
  <div style="display:flex;align-items:center;gap:16px">
    <a href="/">← 返回游戏</a>
    <button class="btn btn-outline btn-sm" onclick="showChangePw()" style="font-size:.78rem;padding:5px 12px;border-radius:6px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted)">修改密码</button>
    <button onclick="doLogout()" style="font-size:.78rem;padding:5px 14px;border-radius:6px;cursor:pointer;border:1px solid var(--red);background:transparent;color:var(--red);font-weight:600">退出登录</button>
  </div>
</div>
<div class="container">
  <div class="card" id="server-url-bar" style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px 16px">
    <label style="font-size:.78rem;font-weight:600;color:var(--muted);white-space:nowrap">云端 API 地址:</label>
    <input id="api-base-url" value="https://haihe-flood-api.lglhm.workers.dev" placeholder="API地址" style="flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:.82rem;color:var(--text);background:var(--bg);outline:none">
    <button class="btn btn-outline btn-sm" onclick="applyServerUrl()" style="white-space:nowrap">应用连接</button>
    <span id="server-status" style="font-size:.74rem;color:var(--muted)"></span>
  </div>
  <div id="health-error" class="card hidden" style="border-color:var(--red);background:rgba(196,78,82,.03)"></div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="rooms">房间管理</button>
    <button class="tab" data-tab="config">参数配置</button>
    <button class="tab" data-tab="data">数据查看</button>
    <button class="tab" data-tab="export">数据导出</button>
  </div>
  <div id="tab-rooms"></div>
  <div id="tab-config" class="hidden"></div>
  <div id="tab-data" class="hidden"></div>
  <div id="tab-export" class="hidden"></div>
</div>
<div id="toast-area"></div>

<script>
// 默认初始化为你部署的 Cloudflare Worker 线上地址
let API = 'https://haihe-flood-api.lglhm.workers.dev';
let currentTab = 'rooms';
let config = {};
let rooms = [];

function applyServerUrl() {
  const input = document.getElementById('api-base-url').value.trim();
  API = input.replace(/\/+$/, '');
  checkHealth();
}

async function checkHealth() {
  const statusEl = document.getElementById('server-status');
  const errorEl = document.getElementById('health-error');
  statusEl.textContent = '检查中...';
  statusEl.style.color = 'var(--muted)';
  errorEl.classList.add('hidden');
  try {
    // 因为后端是 Worker，跨域时无需带 credentials 也能检查 health
    const res = await fetch(API + '/api/health');
    const ct = res.headers.get('content-type') || '';
    const bodyText = await res.text();
    
    if (!ct.includes('json')) {
      statusEl.textContent = '连接异常';
      statusEl.style.color = 'var(--red)';
      errorEl.classList.remove('hidden');
      errorEl.innerHTML = `
        <h3 style="font-size:.9rem;color:var(--red);margin-bottom:8px">云端服务连接失败</h3>
        <p style="font-size:.82rem;color:var(--text);margin-bottom:6px"><b>请求地址:</b> <code>${API}/api/health</code></p>
        <p style="font-size:.82rem;color:var(--text);margin-bottom:6px"><b>返回类型:</b> <code>${ct}</code> (期望 application/json)</p>
        <div style="margin-top:10px;padding:10px;background:var(--bg);border-radius:6px;font-size:.78rem;color:var(--muted);line-height:1.8">
          <b>可能原因与解决方案:</b><br>
          1. Cloudflare Worker 未成功部署或地址拼写错误。<br>
          2. 请确认上方"云端 API 地址"填写正确。
        </div>`;
      return;
    }
    let data;
    try { data = JSON.parse(bodyText); } catch(e) { throw new Error('JSON parse failed'); }
    
    if (data.ok) {
      statusEl.textContent = 'v' + (data.version || '?') + ' 已连接 (Cloudflare D1)';
      statusEl.style.color = 'var(--green)';
      errorEl.classList.add('hidden');
      loadRooms();
    }
  } catch(e) {
    statusEl.textContent = '无法连接';
    statusEl.style.color = 'var(--red)';
    errorEl.classList.remove('hidden');
    errorEl.innerHTML = `
      <h3 style="font-size:.9rem;color:var(--red);margin-bottom:8px">无法连接到云端服务器</h3>
      <p style="font-size:.82rem;color:var(--text);margin-bottom:6px"><b>请求地址:</b> <code>${API}/api/health</code></p>
      <p style="font-size:.82rem;color:var(--text);margin-bottom:6px"><b>错误:</b> <code>${e.message}</code></p>
      <div style="margin-top:10px;padding:10px;background:var(--bg);border-radius:6px;font-size:.78rem;color:var(--muted);line-height:1.8">
        <b>请确认:</b><br>
        1. 你的设备已连接互联网。<br>
        2. Cloudflare Worker 域名未被防火墙拦截。
      </div>`;
  }
}

async function safeFetch(url, opts) {
  try {
    opts = opts || {};
    // Worker 配置了跨域，前端默认不必须强带 cookie，为了兼容性保留
    const res = await fetch(url, opts);
    const ct = res.headers.get('content-type') || '';
    if (!res.ok) {
      let detail = `HTTP ${res.status}`;
      try {
        if (ct.includes('json')) { const d = await res.json(); detail = d.detail || d.message || detail; }
        else { const t = await res.text(); if (t && t.length < 200) detail += ': ' + t; }
      } catch(_){}
      throw new Error(detail);
    }
    if (ct.includes('json')) return await res.json();
    const txt = await res.text();
    try { return JSON.parse(txt); } catch(e) { throw new Error('服务器返回了非JSON内容'); }
  } catch(e) {
    console.error('safeFetch error for ' + url + ':', e);
    toast('请求失败: ' + e.message, 'var(--red)');
    return null;
  }
}

// 注意：退出登录和修改密码暂时只是前端交互，Worker端暂未实现此类接口，如需使用后续需在 worker.js 补充
async function doLogout() {
  toast('退出登录 (本地会话清除)');
  setTimeout(() => { window.location.href = '/'; }, 1000);
}

function showChangePw() {
  toast('云端无状态模式下，暂不需要修改密码', 'var(--amber)');
}

// Tab switching
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    currentTab = t.dataset.tab;
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    t.classList.add('active');
    ['rooms','config','data','export'].forEach(id => {
      document.getElementById('tab-'+id).classList.toggle('hidden', id !== currentTab);
    });
    if (currentTab === 'rooms') loadRooms();
    if (currentTab === 'config') loadConfig();
    if (currentTab === 'data') loadData();
    if (currentTab === 'export') renderExport();
  });
});

function toast(msg, color) {
  const d = document.createElement('div');
  d.className = 'toast';
  d.style.background = color || 'var(--green)';
  d.textContent = msg;
  document.getElementById('toast-area').appendChild(d);
  setTimeout(() => { d.style.opacity='0'; d.style.transition='opacity .3s'; setTimeout(()=>d.remove(),300); }, 2500);
}

// ── Rooms ──
async function loadRooms() {
  document.getElementById('tab-rooms').innerHTML = '<div class="card"><p style="color:var(--muted)">加载中...</p></div>';
  const data = await safeFetch(API + '/api/rooms');
  if (data === null) {
    document.getElementById('tab-rooms').innerHTML = `<div class="card">
      <p style="color:var(--red);margin-bottom:10px">房间列表加载失败</p>
      <button class="btn btn-primary btn-sm" onclick="loadRooms()">重新加载</button>
    </div>`;
    return;
  }
  rooms = data;
  renderRooms();
}

function renderRooms() {
  const el = document.getElementById('tab-rooms');
  el.innerHTML = `
    <div class="card">
      <h3>创建新房间</h3>
      <p style="font-size:.82rem;color:var(--muted);margin-bottom:10px">提示：在当前云端架构下，前端产生第一条数据时房间会自动建立。</p>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="sv">${rooms.length}</div><div class="sl">房间总数</div></div>
      <div class="stat-box"><div class="sv">${rooms.reduce((s,r)=>s+(r.rounds_played||0),0)}</div><div class="sl">总运行轮数</div></div>
    </div>
    <div class="room-grid">${rooms.map(r => `
      <div class="room-card">
        <div class="code">${r.code}</div>
        <div class="meta">已进行 ${r.rounds_played} 轮次</div>
        <div class="meta" style="font-size: 0.7rem;">创建时间: ${new Date(r.created_at).toLocaleString()}</div>
        <div style="margin-top:10px;display:flex;gap:6px">
          <button class="btn btn-outline btn-sm" onclick="copyCode('${r.code}')">复制房间码</button>
        </div>
      </div>`).join('')}
    </div>`;
}

function copyCode(code) {
  navigator.clipboard.writeText(code).then(() => toast('已复制: ' + code));
}

// ── Config ──
async function loadConfig() {
  document.getElementById('tab-config').innerHTML = '<div class="card"><p style="color:var(--muted)">加载中...</p></div>';
  const data = await safeFetch(API + '/api/config');
  if (data === null) {
    document.getElementById('tab-config').innerHTML = '<div class="card"><p style="color:var(--red);margin-bottom:10px">配置加载失败</p><button class="btn btn-primary btn-sm" onclick="loadConfig()">重新加载</button></div>';
    return;
  }
  config = data;
  renderConfig();
}

function renderConfig() {
  const el = document.getElementById('tab-config');
  el.innerHTML = `
    <div class="card"><h3>全局配置说明</h3>
      <p style="font-size:.84rem;color:var(--muted);">目前仿真平台基于云端 Serverless 架构，默认参数由系统代码固定或在创建游戏时动态传入。<br>云端动态覆盖配置功能正在升级中。</p>
    </div>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn btn-outline" onclick="loadConfig()">重新加载</button>
    </div>`;
}

// ── Data ──
async function loadData() {
  document.getElementById('tab-data').innerHTML = '<div class="card"><p style="color:var(--muted)">加载中...</p></div>';
  const [rounds, decisions, chats] = await Promise.all([
    safeFetch(API+'/api/data/rounds'),
    safeFetch(API+'/api/data/decisions'),
    safeFetch(API+'/api/data/chats'),
  ]);
  if (rounds === null || decisions === null || chats === null) {
    document.getElementById('tab-data').innerHTML = '<div class="card"><p style="color:var(--red);margin-bottom:10px">数据加载失败</p><button class="btn btn-primary btn-sm" onclick="loadData()">重新加载</button></div>';
    return;
  }
  renderData(rounds, decisions, chats);
}

function renderData(rounds, decisions, chats) {
  const el = document.getElementById('tab-data');
  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat-box"><div class="sv">${rounds.length}</div><div class="sl">回合记录</div></div>
      <div class="stat-box"><div class="sv">${decisions.length}</div><div class="sl">决策记录</div></div>
      <div class="stat-box"><div class="sv">${chats.length}</div><div class="sl">聊天记录</div></div>
      <div class="stat-box"><div class="sv">${new Set(rounds.map(r=>r.room_id)).size}</div><div class="sl">房间数</div></div>
    </div>
    <div class="card"><h3>回合数据 (最近200条)</h3>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>房间</th><th>轮</th><th>降雨A</th><th>降雨B</th><th>降雨C</th><th>轮损失</th><th>累计损失</th><th>时间</th></tr></thead><tbody>
      ${rounds.slice(0,50).map(r=>`<tr><td>${r.room_id}</td><td>${r.round_num}</td><td>${r.rainfall_A?.toFixed(0)||'-'}</td><td>${r.rainfall_B?.toFixed(0)||'-'}</td><td>${r.rainfall_C?.toFixed(0)||'-'}</td><td style="color:var(--red)">${r.round_loss?.toFixed(0)||'-'}</td><td>${r.total_loss?.toFixed(0)||'-'}</td><td style="font-size:.72rem;color:var(--muted)">${r.ts||''}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
    <div class="card"><h3>玩家决策 (最近100条)</h3>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>房间</th><th>轮</th><th>玩家</th><th>角色</th><th>操作</th><th>值</th><th>时间</th></tr></thead><tbody>
      ${decisions.slice(0,100).map(d=>`<tr><td>${d.room_id}</td><td>${d.round_num}</td><td>${d.player_name||''}</td><td>${d.role||''}</td><td>${d.action_type}</td><td>${d.action_value||''}</td><td style="font-size:.72rem;color:var(--muted)">${d.ts||''}</td></tr>`).join('')}
      </tbody></table></div>
    </div>`;
}

// ── Export ──
function renderExport() {
  const el = document.getElementById('tab-export');
  el.innerHTML = `
    <div class="card"><h3>数据导出</h3>
      <p style="font-size:.84rem;color:var(--muted);margin-bottom:14px">将仿真数据导出为 JSON 格式，便于课后使用 Python/R 脚本进行科研分析。</p>
      <div class="form-row two">
        <div class="fg"><label>房间代码 (留空=导出全部)</label><input id="exp-room" placeholder="如 ABC123"></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:10px">
        <button class="btn btn-primary" onclick="doExport()">下载完整 JSON 数据</button>
      </div>
      <div id="export-result" style="margin-top:14px"></div>
    </div>`;
}

async function doExport() {
  const room = document.getElementById('exp-room').value.trim();
  let url = API + '/api/export/' + (room || '_all');
  try {
    const res = await fetch(url);
    const data = await res.json();
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `haihe_simulation_data_${room||'all'}_${Date.now()}.json`;
    a.click();
    toast('JSON文件已成功下载');
  } catch(e) { toast('导出失败: ' + e.message, 'var(--red)'); }
}

// Init - check health first, then load rooms
checkHealth();
</script>
</body>
</html>
