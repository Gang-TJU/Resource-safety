<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 — 海河洪涝决策仿真平台</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--text:#2d3748;--muted:#718096;--border:#e2e8f0;--blue:#4472C4;--green:#55A868;--amber:#DD8452;--red:#C44E52;--gold:#D4A853;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.top-bar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.top-bar h1{font-size:1.1rem;font-weight:700;color:var(--blue)}
.top-bar a{font-size:.84rem;color:var(--blue);text-decoration:none}
.container{max-width:1100px;margin:0 auto;padding:20px}
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--border);padding-bottom:0}
.tab{padding:10px 20px;font-size:.88rem;font-weight:600;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab:hover{color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.card h3{font-size:.95rem;font-weight:700;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:8px}
.form-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.two{grid-template-columns:1fr 1fr}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:.78rem;color:var(--muted);font-weight:600}
.fg input,.fg select{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:.88rem;color:var(--text);background:var(--bg);outline:none;transition:border .2s}
.fg input:focus{border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:7px;font-size:.86rem;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{opacity:.9}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{opacity:.9}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--blue);color:var(--blue)}
.btn-sm{padding:5px 12px;font-size:.78rem}
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.room-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative}
.room-card .code{font-family:'JetBrains Mono',monospace;font-size:1.3rem;font-weight:700;color:var(--blue);letter-spacing:2px}
.room-card .meta{font-size:.78rem;color:var(--muted);margin:6px 0}
.room-card .status{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.72rem;font-weight:600}
.status-waiting{background:#e8f5e9;color:#2e7d32}
.status-playing{background:#fff3e0;color:#e65100}
.status-finished{background:#f3e5f5;color:#6a1b9a}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.tbl th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);color:var(--muted);font-weight:600;font-size:.76rem}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--border)}
.tbl tr:hover td{background:rgba(68,114,196,.03)}
.toast{position:fixed;top:16px;right:16px;z-index:999;padding:10px 20px;border-radius:8px;background:var(--green);color:#fff;font-size:.86rem;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.12);animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.hidden{display:none!important}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat-box .sv{font-size:1.6rem;font-weight:700;color:var(--blue)}
.stat-box .sl{font-size:.76rem;color:var(--muted);margin-top:4px}
@media(max-width:768px){.form-row{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr 1fr}.room-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top-bar">
  <h1>海河洪涝决策仿真平台 · 管理后台</h1>
  <a href="/">← 返回游戏</a>
</div>
<div class="container">
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="rooms">房间管理</button>
    <button class="tab" data-tab="config">参数配置</button>
    <button class="tab" data-tab="data">数据查看</button>
    <button class="tab" data-tab="export">数据导出</button>
  </div>
  <div id="tab-rooms"></div>
  <div id="tab-config" class="hidden"></div>
  <div id="tab-data" class="hidden"></div>
  <div id="tab-export" class="hidden"></div>
</div>
<div id="toast-area"></div>

<script>
const API = '';
let currentTab = 'rooms';
let config = {};
let rooms = [];

// Tab switching
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    currentTab = t.dataset.tab;
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    t.classList.add('active');
    ['rooms','config','data','export'].forEach(id => {
      document.getElementById('tab-'+id).classList.toggle('hidden', id !== currentTab);
    });
    if (currentTab === 'rooms') loadRooms();
    if (currentTab === 'config') loadConfig();
    if (currentTab === 'data') loadData();
    if (currentTab === 'export') renderExport();
  });
});

function toast(msg, color) {
  const d = document.createElement('div');
  d.className = 'toast';
  d.style.background = color || 'var(--green)';
  d.textContent = msg;
  document.getElementById('toast-area').appendChild(d);
  setTimeout(() => { d.style.opacity='0'; d.style.transition='opacity .3s'; setTimeout(()=>d.remove(),300); }, 2500);
}

// ── Rooms ──
async function loadRooms() {
  const res = await fetch(API + '/api/rooms');
  rooms = await res.json();
  renderRooms();
}
function renderRooms() {
  const el = document.getElementById('tab-rooms');
  el.innerHTML = `
    <div class="card">
      <h3>创建新房间</h3>
      <div style="display:flex;gap:10px;align-items:end">
        <div class="fg" style="flex:1"><label>组名</label><input id="new-group" value="A组" placeholder="如 A组、实验组"></div>
        <button class="btn btn-primary" onclick="createRoom()">创建房间</button>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="sv">${rooms.length}</div><div class="sl">房间总数</div></div>
      <div class="stat-box"><div class="sv">${rooms.filter(r=>r.status==='waiting').length}</div><div class="sl">等待中</div></div>
      <div class="stat-box"><div class="sv">${rooms.filter(r=>r.status==='playing').length}</div><div class="sl">进行中</div></div>
      <div class="stat-box"><div class="sv">${rooms.reduce((s,r)=>s+r.player_count,0)}</div><div class="sl">总玩家数</div></div>
    </div>
    <div class="room-grid">${rooms.map(r => `
      <div class="room-card">
        <div class="code">${r.code}</div>
        <div class="meta">${r.group_name} · ${r.player_count}人 · 第${r.round}轮</div>
        <span class="status status-${r.status}">${r.status==='waiting'?'等待加入':r.status==='playing'?'游戏中':'已结束'}</span>
        <div style="margin-top:10px;display:flex;gap:6px">
          <button class="btn btn-outline btn-sm" onclick="copyCode('${r.code}')">复制房间码</button>
          <button class="btn btn-danger btn-sm" onclick="deleteRoom('${r.code}')">删除</button>
        </div>
      </div>`).join('')}
    </div>`;
}
async function createRoom() {
  const name = document.getElementById('new-group').value || '默认组';
  const res = await fetch(API + '/api/rooms', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({group_name: name}) });
  const data = await res.json();
  toast('房间已创建: ' + data.code);
  loadRooms();
}
async function deleteRoom(code) {
  if (!confirm('确定删除房间 ' + code + '？')) return;
  await fetch(API + '/api/rooms/' + code, { method: 'DELETE' });
  toast('已删除', 'var(--red)');
  loadRooms();
}
function copyCode(code) {
  navigator.clipboard.writeText(code).then(() => toast('已复制: ' + code));
}

// ── Config ──
async function loadConfig() {
  const res = await fetch(API + '/api/config');
  config = await res.json();
  renderConfig();
}
function renderConfig() {
  const el = document.getElementById('tab-config');
  const g = config.game || {};
  const h = config.hydrology || {};
  const e = config.economy || {};
  const ft = config.flood_thresholds || {};
  el.innerHTML = `
    <div class="card"><h3>游戏基本参数</h3>
      <div class="form-row"><div class="fg"><label>总轮数</label><input id="cfg-rounds" type="number" value="${g.max_rounds||6}"></div></div>
      <div style="font-size:.78rem;color:var(--muted);margin-top:4px">阶段倒计时(秒)：</div>
      <div class="form-row">${Object.entries(g.phase_timers||{}).map(([k,v])=>`<div class="fg"><label>${k}</label><input id="cfg-pt-${k}" type="number" value="${v}"></div>`).join('')}</div>
    </div>
    <div class="card"><h3>水文参数</h3>
      <div class="form-row">
        <div class="fg"><label>降雨基数</label><input id="cfg-rain-base" type="number" value="${h.rainfall_base||18}"></div>
        <div class="fg"><label>每轮递增</label><input id="cfg-rain-inc" type="number" value="${h.rainfall_round_increment||8}"></div>
        <div class="fg"><label>波动范围</label><input id="cfg-rain-spread" type="number" value="${h.rainfall_spread||12}"></div>
      </div>
      <div class="form-row">
        <div class="fg"><label>自然衰减率</label><input id="cfg-decay" type="number" step="0.01" value="${h.natural_decay||0.85}"></div>
        <div class="fg"><label>天津最大排量</label><input id="cfg-maxC" type="number" value="${h.max_drain_C||75}"></div>
      </div>
    </div>
    <div class="card"><h3>淹没阈值</h3>
      <div class="form-row">${Object.entries(ft).map(([k,v])=>`<div class="fg"><label>${k} (${(config.villages||{})[k]||k})</label><input id="cfg-ft-${k}" type="number" value="${v}"></div>`).join('')}</div>
    </div>
    <div class="card"><h3>经济参数</h3>
      <div class="form-row">
        <div class="fg"><label>初始村资产</label><input id="cfg-iva" type="number" value="${e.initial_village_asset||500}"></div>
        <div class="fg"><label>初始市资产</label><input id="cfg-ica" type="number" value="${e.initial_city_asset||500}"></div>
        <div class="fg"><label>初始个人资产</label><input id="cfg-ipa" type="number" value="${e.initial_personal_asset||100}"></div>
      </div>
      <div class="form-row">
        <div class="fg"><label>修坝费用</label><input id="cfg-dam-cost" type="number" value="${e.dam_cost||30}"></div>
        <div class="fg"><label>修坝拦水量</label><input id="cfg-dam-block" type="number" value="${e.dam_block||30}"></div>
        <div class="fg"><label>蓄洪区费用</label><input id="cfg-dike-cost" type="number" value="${e.dike_cost||50}"></div>
      </div>
      <div class="form-row">
        <div class="fg"><label>蓄洪区排水量</label><input id="cfg-dike-drain" type="number" value="${e.dike_drain||50}"></div>
        <div class="fg"><label>军牌降水位</label><input id="cfg-army" type="number" value="${e.army_card_reduction||15}"></div>
        <div class="fg"><label>搬+未淹损失</label><input id="cfg-move-loss" type="number" value="${e.move_no_flood_loss||30}"></div>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
      <button class="btn btn-outline" onclick="loadConfig()">重新加载</button>
    </div>`;
}
async function saveConfig() {
  const g = (id) => document.getElementById(id);
  const n = (id) => parseFloat(g(id).value);
  config.game.max_rounds = n('cfg-rounds');
  ['WEATHER','VIL_DISCUSS','LEADER_BUILD','MAYOR_DRAIN','COMPUTE','ROUND_END'].forEach(k => {
    config.game.phase_timers[k] = n('cfg-pt-'+k);
  });
  config.hydrology.rainfall_base = n('cfg-rain-base');
  config.hydrology.rainfall_round_increment = n('cfg-rain-inc');
  config.hydrology.rainfall_spread = n('cfg-rain-spread');
  config.hydrology.natural_decay = n('cfg-decay');
  config.hydrology.max_drain_C = n('cfg-maxC');
  Object.keys(config.flood_thresholds).forEach(k => {
    config.flood_thresholds[k] = n('cfg-ft-'+k);
  });
  config.economy.initial_village_asset = n('cfg-iva');
  config.economy.initial_city_asset = n('cfg-ica');
  config.economy.initial_personal_asset = n('cfg-ipa');
  config.economy.dam_cost = n('cfg-dam-cost');
  config.economy.dam_block = n('cfg-dam-block');
  config.economy.dike_cost = n('cfg-dike-cost');
  config.economy.dike_drain = n('cfg-dike-drain');
  config.economy.army_card_reduction = n('cfg-army');
  config.economy.move_no_flood_loss = n('cfg-move-loss');
  await fetch(API + '/api/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(config) });
  toast('配置已保存');
}

// ── Data ──
async function loadData() {
  const [rounds, decisions, chats] = await Promise.all([
    fetch(API+'/api/data/rounds').then(r=>r.json()),
    fetch(API+'/api/data/decisions').then(r=>r.json()),
    fetch(API+'/api/data/chats').then(r=>r.json()),
  ]);
  renderData(rounds, decisions, chats);
}
function renderData(rounds, decisions, chats) {
  const el = document.getElementById('tab-data');
  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat-box"><div class="sv">${rounds.length}</div><div class="sl">回合记录</div></div>
      <div class="stat-box"><div class="sv">${decisions.length}</div><div class="sl">决策记录</div></div>
      <div class="stat-box"><div class="sv">${chats.length}</div><div class="sl">聊天记录</div></div>
      <div class="stat-box"><div class="sv">${new Set(rounds.map(r=>r.room_id)).size}</div><div class="sl">房间数</div></div>
    </div>
    <div class="card"><h3>回合数据 (最近200条)</h3>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>房间</th><th>轮</th><th>降雨A</th><th>降雨B</th><th>降雨C</th><th>轮损失</th><th>累计损失</th><th>时间</th></tr></thead><tbody>
      ${rounds.slice(0,50).map(r=>`<tr><td>${r.room_id}</td><td>${r.round_num}</td><td>${r.rainfall_A?.toFixed(0)||'-'}</td><td>${r.rainfall_B?.toFixed(0)||'-'}</td><td>${r.rainfall_C?.toFixed(0)||'-'}</td><td style="color:var(--red)">${r.round_loss?.toFixed(0)||'-'}</td><td>${r.total_loss?.toFixed(0)||'-'}</td><td style="font-size:.72rem;color:var(--muted)">${r.ts||''}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
    <div class="card"><h3>玩家决策 (最近100条)</h3>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>房间</th><th>轮</th><th>玩家</th><th>角色</th><th>操作</th><th>值</th><th>时间</th></tr></thead><tbody>
      ${decisions.slice(0,100).map(d=>`<tr><td>${d.room_id}</td><td>${d.round_num}</td><td>${d.player_name||''}</td><td>${d.role||''}</td><td>${d.action_type}</td><td>${d.action_value||''}</td><td style="font-size:.72rem;color:var(--muted)">${d.ts||''}</td></tr>`).join('')}
      </tbody></table></div>
    </div>`;
}

// ── Export ──
function renderExport() {
  const el = document.getElementById('tab-export');
  el.innerHTML = `
    <div class="card"><h3>数据导出</h3>
      <p style="font-size:.84rem;color:var(--muted);margin-bottom:14px">将仿真数据导出为 Excel 或 JSON 格式，用于课后分析和研究。</p>
      <div class="form-row two">
        <div class="fg"><label>房间代码 (留空=全部)</label><input id="exp-room" placeholder="如 ABC123"></div>
        <div class="fg"><label>格式</label><select id="exp-fmt"><option value="json">JSON (浏览器下载)</option><option value="xlsx">Excel (服务端生成)</option></select></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:10px">
        <button class="btn btn-primary" onclick="doExport()">导出数据</button>
      </div>
      <div id="export-result" style="margin-top:14px"></div>
    </div>
    <div class="card"><h3>命令行导出 (Excel/CSV)</h3>
      <p style="font-size:.84rem;color:var(--muted);line-height:1.8">在服务器上执行以下命令导出完整 Excel 文件：</p>
      <pre style="background:var(--bg);padding:12px;border-radius:6px;font-size:.82rem;line-height:1.6;overflow-x:auto;border:1px solid var(--border)">
# 导出所有数据为 Excel
python export.py --format xlsx

# 导出指定房间
python export.py --room ABC123 --format xlsx

# 导出为 CSV
python export.py --format csv</pre>
    </div>`;
}
async function doExport() {
  const room = document.getElementById('exp-room').value.trim();
  const fmt = document.getElementById('exp-fmt').value;
  let url = API + '/api/export/' + (room || '_all') + '?fmt=' + fmt;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (fmt === 'json') {
      const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `haihe_export_${room||'all'}_${Date.now()}.json`;
      a.click();
      toast('JSON已下载');
    } else {
      document.getElementById('export-result').innerHTML = `<p style="color:var(--amber);font-size:.84rem">Excel导出请在服务器执行: <code>python export.py --room ${room} --format xlsx</code></p>`;
    }
  } catch(e) { toast('导出失败: ' + e.message, 'var(--red)'); }
}

// Init
loadRooms();
</script>
</body>
</html>
