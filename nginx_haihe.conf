# ============================================================
# Nginx 配置 — 海河流域洪涝风险决策仿真平台
# 域名: www.resil-hub.cn
# 后端: Python uvicorn 运行在 127.0.0.1:8080
# ============================================================
#
# 使用方法:
#   1. 将此文件复制到 /etc/nginx/conf.d/haihe.conf
#      或替换 /etc/nginx/sites-available/default
#   2. 执行 nginx -t 验证语法
#   3. 执行 systemctl reload nginx 重载配置
#
# 关键原理:
#   - /api/  和 /socket.io/ 请求 → 转发给后端 Python 服务 (8080端口)
#   - 其他请求 → 由 Nginx 直接提供静态文件(index.html等)
# ============================================================

upstream haihe_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name www.resil-hub.cn resil-hub.cn;

    # 如果有 HTTPS 证书, 取消下面注释并注释掉上面 listen 80
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/ssl/resil-hub.cn.pem;
    # ssl_certificate_key /etc/nginx/ssl/resil-hub.cn.key;

    # ---------- 静态文件目录 ----------
    # 修改为你服务器上实际存放 index.html 等文件的目录
    root /opt/haihe/output;
    index index.html;

    # ---------- API 请求 → 转发给后端 ----------
    location /api/ {
        proxy_pass         http://haihe_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 确保 cookie 正确传递
        proxy_set_header   Cookie $http_cookie;
        proxy_pass_header  Set-Cookie;
    }

    # ---------- Socket.IO WebSocket → 转发给后端 ----------
    location /socket.io/ {
        proxy_pass         http://haihe_backend;
        proxy_http_version 1.1;

        # WebSocket 升级必须的头部
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;  # WebSocket 长连接
        proxy_send_timeout 86400s;
    }

    # ---------- /admin 路由 → 转发给后端(需要 cookie 鉴权) ----------
    location = /admin {
        proxy_pass         http://haihe_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
    }

    # ---------- 静态页面 ----------
    location = / {
        try_files /index.html =404;
    }

    location = /admin.html {
        try_files /admin.html =404;
    }

    location = /admin_login.html {
        try_files /admin_login.html =404;
    }

    # ---------- 其他静态资源(js/css/图片等) ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 安全: 禁止访问敏感文件 ----------
    location ~* \.(json|py|db|sqlite|log)$ {
        deny all;
        return 404;
    }

    # ---------- 日志 ----------
    access_log /var/log/nginx/haihe_access.log;
    error_log  /var/log/nginx/haihe_error.log;
}
